name: Build Netflix Fresh APK

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: Extract Android project
        run: |
          mkdir buildsrc
          unzip -q NetflixFresh-IMDb-Fixed.zip -d buildsrc

      - name: Build APK
        working-directory: buildsrc
        run: gradle :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NetflixFresh-APK
          path: buildsrc/app/build/outputs/apk/debug/app-debug.apk
